<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>찰칵 식단 - 스마트 칼로리 계산기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Noto Sans KR"', 'sans-serif'] },
                    colors: { primary: '#10B981', primary_dark: '#059669' }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f3f4f6; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .fade-enter { opacity: 0; transform: translateY(10px); }
        .fade-enter-active { opacity: 1; transform: translateY(0); transition: opacity 300ms, transform 300ms; }
        .progress-ring__circle { transition: stroke-dashoffset 0.5s ease-in-out, stroke 0.3s ease; transform: rotate(-90deg); transform-origin: 50% 50%; }
        @keyframes pulse-danger { 0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); } 50% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } }
        .overflow-alert-card { animation: pulse-danger 2s infinite ease-in-out; border-color: #f87171 !important; }
        @keyframes scan { 0% { top: 0%; opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { top: 100%; opacity: 0; } }
        
        /* 스크롤바 디자인 */
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 20px; width: 20px; border-radius: 50%; background: #10B981; cursor: pointer; margin-top: -8px; box-shadow: 0 2px 6px rgba(0,0,0,0.2); }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 6px; cursor: pointer; background: #e5e7eb; border-radius: 3px; }
    </style>
</head>
<body class="text-gray-800 antialiased h-screen flex justify-center items-center overflow-hidden">
    <div class="w-full max-w-md h-full sm:h-[850px] bg-white sm:rounded-[2.5rem] sm:border-[8px] border-gray-800 shadow-2xl relative overflow-hidden flex flex-col">
        <!-- 상단 헤더 -->
        <header class="pt-12 pb-4 px-6 bg-white z-10 shadow-sm flex justify-between items-center">
            <h1 onclick="handleAdminClick()" class="text-xl font-bold text-gray-800 flex items-center gap-2 cursor-pointer select-none" style="-webkit-tap-highlight-color: transparent;">
                <i class="fa-solid fa-leaf text-primary"></i> 찰칵 식단
            </h1>
            <div class="flex items-center gap-4">
                <button onclick="shareApp()" class="text-primary hover:text-primary_dark text-sm font-bold flex items-center gap-1 transition-colors">
                    <i class="fa-solid fa-share-nodes"></i> 공유
                </button>
                <button onclick="resetApp()" class="text-gray-400 hover:text-gray-600 text-sm flex items-center gap-1 transition-colors">
                    <i class="fa-solid fa-gear"></i> 초기화
                </button>
            </div>
        </header>

        <!-- 관리자 대시보드 화면 -->
        <div id="view-admin" class="hidden flex-1 overflow-y-auto p-6 bg-gray-50 flex flex-col transition-all duration-300 relative z-20">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-2xl font-bold text-gray-800 flex items-center gap-2">
                    <i class="fa-solid fa-lock text-primary"></i> 관리자 페이지
                </h2>
                <button onclick="showView('view-dashboard')" class="text-gray-400 hover:text-gray-600 p-2 text-xl">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="space-y-4">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-col">
                    <p class="text-sm font-medium text-gray-500 mb-1">금일 이미지 업로드 횟수</p>
                    <p class="text-4xl font-black text-gray-800" id="admin-today-count">0 <span class="text-lg font-bold text-gray-400">회</span></p>
                </div>
            </div>
        </div>

        <!-- 온보딩(정보 입력) 화면 -->
        <div id="view-onboarding" class="flex-1 overflow-y-auto p-6 bg-white flex flex-col transition-all duration-300">
            <h2 class="text-2xl font-bold mb-2">당신을 알려주세요 👋</h2>
            <p class="text-gray-500 mb-6 text-sm">정확한 하루 권장 칼로리 계산을 위해 한 번만 입력하시면 됩니다.</p>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">성별</label>
                    <div class="flex gap-2">
                        <button type="button" id="btn-gender-m" onclick="setGender('M')" class="flex-1 py-3 border border-gray-300 rounded-xl bg-gray-50 text-gray-600 font-medium transition-colors">남성</button>
                        <button type="button" id="btn-gender-f" onclick="setGender('F')" class="flex-1 py-3 border border-gray-300 rounded-xl bg-gray-50 text-gray-600 font-medium transition-colors">여성</button>
                    </div>
                </div>
                <div class="flex gap-4">
                    <div class="flex-1">
                        <label class="block text-sm font-medium text-gray-700 mb-1">나이</label>
                        <input type="number" id="input-age" placeholder="예: 28" class="w-full px-4 py-3 border border-gray-300 rounded-xl outline-none focus:ring-2 focus:ring-primary">
                    </div>
                </div>
                <div class="flex gap-4">
                    <div class="flex-1">
                        <label class="block text-sm font-medium text-gray-700 mb-1">키 (cm)</label>
                        <input type="number" id="input-height" placeholder="예: 175" class="w-full px-4 py-3 border border-gray-300 rounded-xl outline-none focus:ring-2 focus:ring-primary">
                    </div>
                    <div class="flex-1">
                        <label class="block text-sm font-medium text-gray-700 mb-1">몸무게 (kg)</label>
                        <input type="number" id="input-weight" placeholder="예: 70" class="w-full px-4 py-3 border border-gray-300 rounded-xl outline-none focus:ring-2 focus:ring-primary">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">활동량</label>
                    <select id="input-activity" class="w-full px-4 py-3 border border-gray-300 rounded-xl outline-none focus:ring-2 focus:ring-primary bg-white">
                        <option value="1.2">거의 운동하지 않음 (사무직)</option>
                        <option value="1.375">가벼운 활동 (주 1~3일 운동)</option>
                        <option value="1.55" selected>보통 활동 (주 3~5일 운동)</option>
                        <option value="1.725">적극적 활동 (주 6~7일 운동)</option>
                    </select>
                </div>
            </div>
            <div class="mt-auto pt-6 pb-4">
                <button onclick="calculateProfile()" class="w-full bg-primary hover:bg-primary_dark text-white font-bold py-4 rounded-xl shadow-lg transition-all active:scale-95">내 권장 칼로리 확인하기</button>
            </div>
        </div>

        <!-- 메인 대시보드 화면 -->
        <div id="view-dashboard" class="hidden flex-1 overflow-y-auto bg-gray-50 flex flex-col relative pb-6">
            <!-- 상단 칼로리 요약 -->
            <div id="summary-card" class="bg-white p-6 rounded-b-3xl shadow-sm mb-4 transition-all duration-300 border-b-2 border-transparent">
                <div class="flex justify-between items-center mb-6">
                    <div class="flex items-center gap-2">
                        <h2 class="text-lg font-bold">식단 요약</h2>
                        <span id="overflow-badge" class="hidden px-2 py-0.5 text-xs font-bold bg-red-100 text-red-600 rounded-full flex items-center gap-1 animate-pulse">
                            <i class="fa-solid fa-triangle-exclamation"></i> 초과
                        </span>
                    </div>
                    <div class="flex items-center gap-3 bg-gray-100 rounded-full px-3 py-1">
                        <span class="text-xs font-bold text-gray-700 min-w-[50px] text-center" id="display-date">오늘</span>
                    </div>
                </div>
                <div class="relative flex justify-center items-center mb-6">
                    <svg class="w-48 h-48" viewBox="0 0 120 120">
                        <circle class="text-gray-200 stroke-current" stroke-width="10" cx="60" cy="60" r="50" fill="transparent"></circle>
                        <circle id="progress-circle" class="text-primary stroke-current progress-ring__circle" stroke-width="10" stroke-linecap="round" cx="60" cy="60" r="50" fill="transparent" stroke-dasharray="314.159" stroke-dashoffset="314.159"></circle>
                    </svg>
                    <div class="absolute flex flex-col items-center justify-center text-center">
                        <span class="text-gray-500 text-xs font-medium mb-1">섭취한 칼로리</span>
                        <span class="text-3xl font-black text-gray-800 transition-colors duration-300" id="display-consumed">0</span>
                        <span class="text-gray-400 text-xs font-medium mt-1">/ <span id="display-goal">2000</span> kcal</span>
                    </div>
                </div>
                <div class="flex justify-around text-center border-t border-gray-100 pt-4">
                    <div>
                        <p class="text-xs text-gray-400 font-medium mb-1" id="remaining-label">남은 칼로리</p>
                        <p class="text-lg font-bold text-blue-500" id="display-remaining">2000</p>
                    </div>
                    <div class="w-px bg-gray-200"></div>
                    <div>
                        <p class="text-xs text-gray-400 font-medium mb-1">목표 달성률</p>
                        <p class="text-lg font-bold text-primary" id="display-percent">0%</p>
                    </div>
                </div>
            </div>
            
            <div class="px-4 mb-4">
                <button onclick="openUploadModal()" class="w-full bg-primary hover:bg-primary_dark text-white font-bold py-4 rounded-2xl shadow-lg transition-all flex justify-center items-center gap-2 active:scale-95 text-lg">
                    <i class="fa-solid fa-camera"></i> 사진으로 식단 추가하기
                </button>
            </div>

            <!-- 먹은 음식 리스트 영역 -->
            <div class="px-4 pb-6">
                <div class="flex justify-between items-end mb-3 ml-1">
                    <h3 class="font-bold text-gray-700" id="food-list-title">오늘 먹은 음식</h3>
                </div>
                <div id="food-list" class="space-y-4">
                    <div id="empty-state" class="text-center py-10 bg-white rounded-2xl border border-gray-100 shadow-sm">
                        <div class="w-16 h-16 bg-gray-50 rounded-full flex items-center justify-center mx-auto mb-3 text-gray-300 text-2xl">
                            <i class="fa-solid fa-utensils"></i>
                        </div>
                        <p class="text-gray-400 text-sm">아직 기록된 식단이 없습니다.<br>사진을 찍어 기록해보세요!</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 사진 업로드 모달 (카메라 & 갤러리 분리 완벽 복구) -->
        <div id="upload-modal" class="hidden absolute inset-0 bg-black/60 z-50 flex justify-center items-end sm:items-center">
            <div class="bg-white w-full h-[85%] sm:h-auto sm:max-h-[85%] rounded-t-3xl sm:rounded-3xl p-6 flex flex-col animate-[translate-y_0.3s_ease-out]">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-xl font-bold">음식 사진 추가</h3>
                    <button onclick="closeUploadModal()" class="text-gray-400 hover:text-gray-600 p-2"><i class="fa-solid fa-xmark text-xl"></i></button>
                </div>
                
                <input type="file" id="camera-input" accept="image/*" capture="environment" class="hidden" onchange="handleImageSelect(event)">
                <input type="file" id="gallery-input" accept="image/*" class="hidden" onchange="handleImageSelect(event)">
                
                <div class="flex-1 border-2 border-dashed border-gray-300 rounded-2xl flex flex-col justify-center items-center bg-gray-50 relative overflow-hidden" id="drop-zone">
                    <div id="upload-placeholder" class="text-center flex flex-col items-center gap-4 w-full px-6">
                        <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center text-3xl text-gray-300 mb-2">
                            <i class="fa-solid fa-image"></i>
                        </div>
                        
                        <!-- 카메라/갤러리 버튼 -->
                        <div id="camera-gallery-btns" class="w-full flex gap-3">
                            <button onclick="document.getElementById('camera-input').click()" class="flex-1 bg-white border border-gray-200 py-4 rounded-xl shadow-sm hover:bg-gray-50 text-gray-700 font-bold flex flex-col items-center gap-2">
                                <i class="fa-solid fa-camera text-2xl text-primary"></i>
                                <span>카메라 촬영</span>
                            </button>
                            <button onclick="document.getElementById('gallery-input').click()" class="flex-1 bg-white border border-gray-200 py-4 rounded-xl shadow-sm hover:bg-gray-50 text-gray-700 font-bold flex flex-col items-center gap-2">
                                <i class="fa-solid fa-images text-2xl text-blue-500"></i>
                                <span>앨범 선택</span>
                            </button>
                        </div>
                    </div>
                    
                    <img id="image-preview" class="hidden absolute inset-0 w-full h-full object-cover">
                    <!-- 스캔 애니메이션 -->
                    <div id="scan-line" class="hidden absolute w-full h-4 bg-gradient-to-b from-primary/60 to-transparent blur-sm top-0 left-0"></div>
                </div>
                
                <button id="btn-analyze" onclick="startAnalysis()" class="hidden w-full bg-primary hover:bg-primary_dark text-white font-bold py-4 rounded-xl shadow-lg transition-all mt-6 active:scale-95 flex justify-center items-center gap-2">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> AI 분석 시작하기
                </button>
            </div>
        </div>

        <!-- 공유 모달 -->
        <div id="share-modal" class="hidden absolute inset-0 bg-black/60 z-50 flex justify-center items-end sm:items-center">
            <div class="bg-white w-full sm:w-[90%] rounded-t-3xl sm:rounded-3xl p-6 flex flex-col">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-xl font-bold">공유하기</h3>
                    <button onclick="closeShareModal()" class="text-gray-400 hover:text-gray-600 p-2"><i class="fa-solid fa-xmark text-xl"></i></button>
                </div>
                <div class="grid grid-cols-3 gap-4 text-center">
                    <a href="http://pf.kakao.com/_kSxbnK" target="_blank" class="flex flex-col items-center gap-2">
                        <div class="w-14 h-14 bg-[#FEE500] rounded-full flex items-center justify-center text-2xl text-[#391B1B] shadow-sm"><i class="fa-solid fa-comment"></i></div>
                        <span class="text-xs font-medium text-gray-700">카카오 채널</span>
                    </a>
                    <button onclick="shareViaWebAPI()" class="flex flex-col items-center gap-2">
                        <div class="w-14 h-14 bg-blue-500 rounded-full flex items-center justify-center text-2xl text-white shadow-sm"><i class="fa-solid fa-share-nodes"></i></div>
                        <span class="text-xs font-medium text-gray-700">친구 공유</span>
                    </button>
                    <button onclick="copyUrl()" class="flex flex-col items-center gap-2">
                        <div class="w-14 h-14 bg-gray-200 rounded-full flex items-center justify-center text-2xl text-gray-600 shadow-sm"><i class="fa-solid fa-link"></i></div>
                        <span class="text-xs font-medium text-gray-700">URL 복사</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- 관리자 비밀번호 모달 -->
        <div id="password-modal" class="hidden absolute inset-0 bg-black/60 z-50 flex justify-center items-center">
            <div class="bg-white w-[80%] max-w-sm rounded-3xl p-6 flex flex-col">
                <h3 class="text-lg font-bold mb-2">관리자 인증</h3>
                <p class="text-sm text-gray-500 mb-4">비밀번호를 입력해주세요.</p>
                <input type="password" id="admin-password-input" placeholder="****" class="w-full px-4 py-3 border border-gray-300 rounded-xl outline-none focus:ring-2 focus:ring-primary mb-2 text-center text-lg tracking-widest">
                <div class="flex gap-2 mt-2">
                    <button onclick="closePasswordModal()" class="flex-1 py-3 border border-gray-300 rounded-xl bg-gray-50 text-gray-600 font-medium">취소</button>
                    <button onclick="verifyPassword()" class="flex-1 bg-primary text-white font-bold py-3 rounded-xl">확인</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 로직 스크립트 -->
    <script>
        let currentGender = null;
        let adminClickCount = 0;
        let adminClickTimer = null;
        let compressedImageBase64 = null; 
        
        // 음식 카드 관리를 위한 전역 변수
        let foodItems = {}; 

        // 모달 및 뷰 전환 제어
        function showView(viewId) {
            document.getElementById('view-onboarding').classList.add('hidden');
            document.getElementById('view-dashboard').classList.add('hidden');
            document.getElementById('view-admin').classList.add('hidden');
            document.getElementById(viewId).classList.remove('hidden');
        }

        // --- 온보딩: 칼로리 계산 (해리스-베네딕트/Mifflin-St Jeor 혼합 기반) ---
        function setGender(gender) {
            currentGender = gender;
            const btnM = document.getElementById('btn-gender-m');
            const btnF = document.getElementById('btn-gender-f');
            btnM.classList.remove('ring-2', 'ring-primary', 'text-primary', 'bg-green-50');
            btnF.classList.remove('ring-2', 'ring-primary', 'text-primary', 'bg-green-50');
            if(gender === 'M') btnM.classList.add('ring-2', 'ring-primary', 'text-primary', 'bg-green-50');
            else btnF.classList.add('ring-2', 'ring-primary', 'text-primary', 'bg-green-50');
        }

        function calculateProfile() {
            const age = document.getElementById('input-age').value;
            const height = document.getElementById('input-height').value;
            const weight = document.getElementById('input-weight').value;
            const activity = parseFloat(document.getElementById('input-activity').value);

            if(!currentGender || !age || !height || !weight) {
                alert("모든 정보를 입력해주세요.");
                return;
            }

            // 기초대사량(BMR) 계산
            let bmr = 0;
            if(currentGender === 'M') {
                bmr = (10 * weight) + (6.25 * height) - (5 * age) + 5;
            } else {
                bmr = (10 * weight) + (6.25 * height) - (5 * age) - 161;
            }
            
            // 활동량 반영 일일 권장 칼로리
            const dailyGoal = Math.round(bmr * activity);
            document.getElementById('display-goal').innerText = dailyGoal;
            
            updateProgressUI();
            showView('view-dashboard');
        }

        // --- 관리자 모드 ---
        function handleAdminClick() {
            adminClickCount++;
            clearTimeout(adminClickTimer);
            adminClickTimer = setTimeout(() => { adminClickCount = 0; }, 2000);
            if(adminClickCount >= 5) {
                document.getElementById('admin-password-input').value = '';
                document.getElementById('password-modal').classList.remove('hidden');
                adminClickCount = 0; 
            }
        }
        function closePasswordModal() { document.getElementById('password-modal').classList.add('hidden'); }
        function verifyPassword() {
            if(document.getElementById('admin-password-input').value === '0319') {
                closePasswordModal();
                showView('view-admin');
            } else {
                alert('비밀번호가 틀렸습니다.');
            }
        }

        // --- 공유 기능 ---
        function shareApp() { document.getElementById('share-modal').classList.remove('hidden'); }
        function closeShareModal() { document.getElementById('share-modal').classList.add('hidden'); }
        function shareViaWebAPI() {
            if (navigator.share) {
                navigator.share({ title: '찰칵 식단', url: window.location.href });
            } else { alert("공유를 지원하지 않는 브라우저입니다."); }
        }
        function copyUrl() {
            const url = window.location.href;
            const tempInput = document.createElement("input");
            tempInput.value = url;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand("copy");
            document.body.removeChild(tempInput);
            alert("URL이 복사되었습니다!");
            closeShareModal();
        }

        // --- 초기화 ---
        function resetApp() { 
            if(confirm("모든 데이터를 초기화하시겠습니까?")) {
                currentGender = null;
                setGender(''); 
                document.getElementById('input-age').value = '';
                document.getElementById('input-height').value = '';
                document.getElementById('input-weight').value = '';
                document.getElementById('display-consumed').innerText = '0';
                foodItems = {}; // 목록 초기화
                document.getElementById('food-list').innerHTML = `
                    <div id="empty-state" class="text-center py-10 bg-white rounded-2xl border border-gray-100 shadow-sm">
                        <div class="w-16 h-16 bg-gray-50 rounded-full flex items-center justify-center mx-auto mb-3 text-gray-300 text-2xl"><i class="fa-solid fa-utensils"></i></div>
                        <p class="text-gray-400 text-sm">아직 기록된 식단이 없습니다.<br>사진을 찍어 기록해보세요!</p>
                    </div>`;
                showView('view-onboarding'); 
            }
        }

        // --- 사진 업로드 및 캔버스 압축 ---
        function openUploadModal() {
            document.getElementById('upload-placeholder').classList.remove('hidden');
            document.getElementById('camera-gallery-btns').classList.remove('hidden');
            document.getElementById('image-preview').classList.add('hidden');
            document.getElementById('btn-analyze').classList.add('hidden');
            document.getElementById('camera-input').value = "";
            document.getElementById('gallery-input').value = "";
            compressedImageBase64 = null;
            document.getElementById('upload-modal').classList.remove('hidden');
        }
        function closeUploadModal() { document.getElementById('upload-modal').classList.add('hidden'); }

        function handleImageSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800; 
                    let scaleSize = img.width > MAX_WIDTH ? MAX_WIDTH / img.width : 1;
                    
                    canvas.width = img.width * scaleSize;
                    canvas.height = img.height * scaleSize;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    
                    compressedImageBase64 = canvas.toDataURL('image/jpeg', 0.8); 

                    document.getElementById('upload-placeholder').classList.add('hidden');
                    const imgPreview = document.getElementById('image-preview');
                    imgPreview.src = compressedImageBase64;
                    imgPreview.classList.remove('hidden');
                    document.getElementById('btn-analyze').classList.remove('hidden');
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        // --- Vercel API 분석 시작 ---
        async function startAnalysis() {
            if (!compressedImageBase64) return;

            document.getElementById('scan-line').classList.remove('hidden');
            document.getElementById('scan-line').style.animation = 'scan 2s infinite linear';
            const analyzeBtn = document.getElementById('btn-analyze');
            const originalText = analyzeBtn.innerHTML;
            analyzeBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> AI 분석 중...';
            analyzeBtn.disabled = true;

            try {
                // Vercel 서버로 요청 (gemini-3.7-flash 연동 완료 상태)
                const response = await fetch('/api/diet', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: compressedImageBase64 })
                });

                const result = await response.json();
                if (!response.ok) throw new Error(result.error || "서버 에러가 발생했습니다.");

                if (result.success && result.data) {
                    addFoodToList(result.data, compressedImageBase64);
                    closeUploadModal();
                }

            } catch (error) {
                alert("분석 에러: " + error.message);
            } finally {
                document.getElementById('scan-line').classList.add('hidden');
                analyzeBtn.innerHTML = originalText;
                analyzeBtn.disabled = false;
            }
        }

        // --- 식단 카드 생성 및 스크롤바 조절 기능 ---
        function addFoodToList(data, imgSrc) {
            const foodList = document.getElementById('food-list');
            const emptyState = document.getElementById('empty-state');
            if(emptyState) emptyState.remove(); 

            const itemId = 'food_' + Date.now();
            // 기본값 저장
            foodItems[itemId] = {
                baseKcal: data.baseKcal, baseCarbs: data.carbs, baseProtein: data.protein, baseFat: data.fat,
                currentKcal: data.baseKcal
            };

            const foodCard = document.createElement('div');
            foodCard.className = 'bg-white p-5 rounded-2xl border border-gray-100 shadow-sm flex flex-col gap-4 fade-enter fade-enter-active';
            foodCard.innerHTML = `
                <div class="flex gap-4">
                    <img src="${imgSrc}" class="w-24 h-24 object-cover rounded-xl border border-gray-100 shadow-sm">
                    <div class="flex-1 flex flex-col justify-between py-0.5">
                        <div>
                            <div class="flex justify-between items-start mb-1">
                                <h4 class="font-bold text-gray-800 text-sm">${data.name}</h4>
                                <span class="text-[10px] font-bold text-primary bg-green-50 px-2 py-1 rounded-full border border-green-100 whitespace-nowrap"><i class="fa-solid fa-check"></i> 완료</span>
                            </div>
                            <p class="text-xs text-gray-500 mb-2 line-clamp-2 leading-relaxed">${data.desc}</p>
                        </div>
                        <div class="flex justify-between items-end">
                            <p class="text-xl font-black text-gray-800 tracking-tight"><span id="val-kcal-${itemId}">${data.baseKcal}</span> <span class="text-xs font-medium text-gray-400">kcal</span></p>
                            <div class="flex gap-1.5">
                                <span class="text-[10px] font-bold px-1.5 py-1 rounded-md bg-orange-50 text-orange-600">탄 <span id="val-carbs-${itemId}">${data.carbs}</span>g</span>
                                <span class="text-[10px] font-bold px-1.5 py-1 rounded-md bg-blue-50 text-blue-600">단 <span id="val-protein-${itemId}">${data.protein}</span>g</span>
                                <span class="text-[10px] font-bold px-1.5 py-1 rounded-md bg-red-50 text-red-600">지 <span id="val-fat-${itemId}">${data.fat}</span>g</span>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- 먹은 양 조절 스크롤바 -->
                <div class="mt-2 bg-gray-50 p-3 rounded-xl border border-gray-100">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-xs font-bold text-gray-600">실제 먹은 양 조절</span>
                        <span class="text-xs font-bold text-primary" id="ratio-${itemId}">100%</span>
                    </div>
                    <input type="range" min="10" max="200" value="100" class="w-full" oninput="updatePortion('${itemId}', this.value)">
                </div>
            `;
            foodList.prepend(foodCard);
            recalculateTotal();
        }

        // 스크롤바 조작 시 해당 음식의 영양소와 총 칼로리 업데이트
        function updatePortion(itemId, ratio) {
            document.getElementById(`ratio-${itemId}`).innerText = ratio + '%';
            const multiplier = ratio / 100;
            const item = foodItems[itemId];
            
            // 비율에 맞춰 데이터 변환
            const newKcal = Math.round(item.baseKcal * multiplier);
            item.currentKcal = newKcal; // 글로벌 합산용 상태 업데이트
            
            document.getElementById(`val-kcal-${itemId}`).innerText = newKcal;
            document.getElementById(`val-carbs-${itemId}`).innerText = Math.round(item.baseCarbs * multiplier);
            document.getElementById(`val-protein-${itemId}`).innerText = Math.round(item.baseProtein * multiplier);
            document.getElementById(`val-fat-${itemId}`).innerText = Math.round(item.baseFat * multiplier);
            
            recalculateTotal();
        }

        // 등록된 모든 카드의 칼로리를 합산하여 메인 원형 그래프 업데이트
        function recalculateTotal() {
            let totalConsumed = 0;
            for(let key in foodItems) {
                totalConsumed += foodItems[key].currentKcal;
            }
            document.getElementById('display-consumed').innerText = totalConsumed;
            updateProgressUI();
        }

        // 상단 원형 칼로리 그래프 그리기
        function updateProgressUI() {
            const consumed = parseInt(document.getElementById('display-consumed').innerText) || 0;
            const goal = parseInt(document.getElementById('display-goal').innerText) || 2000;
            const remaining = goal - consumed;
            
            document.getElementById('display-remaining').innerText = remaining > 0 ? remaining : Math.abs(remaining);
            
            if(remaining < 0) {
                document.getElementById('overflow-badge').classList.remove('hidden');
                document.getElementById('summary-card').classList.add('overflow-alert-card');
                document.getElementById('remaining-label').innerText = "초과 칼로리";
                document.getElementById('display-remaining').classList.replace('text-blue-500', 'text-red-500');
            } else {
                document.getElementById('overflow-badge').classList.add('hidden');
                document.getElementById('summary-card').classList.remove('overflow-alert-card');
                document.getElementById('remaining-label').innerText = "남은 칼로리";
                document.getElementById('display-remaining').classList.replace('text-red-500', 'text-blue-500');
            }

            let percent = Math.min(Math.round((consumed / goal) * 100), 100);
            document.getElementById('display-percent').innerText = percent + '%';
            
            const circle = document.getElementById('progress-circle');
            const circumference = 314.159; 
            circle.style.strokeDashoffset = circumference - (percent / 100) * circumference;
        }
    </script>
</body>
</html>
